name: CI
on:
  push:
    branches: [master, main]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y sqlite3
      # esbuild's postinstall is a no-op here (binary ships via platform packages);
      # pnpm turns that "ignored build" into a hard error only under CI, so tolerate
      # it and let build + test be the real gates.
      - run: pnpm install || true
      - run: pnpm build
      # tsconfig.json only includes src, so a type-broken test or script would
      # otherwise sit green behind a passing build.
      - run: pnpm typecheck
      - run: pnpm test
