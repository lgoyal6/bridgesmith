name: CI
on:
  push:
    branches: [master, main]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y sqlite3
      - run: pnpm install
      - run: pnpm build
      - run: pnpm test
