name: CI
on:
  push:
    branches: [master, main]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y sqlite3
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # tsconfig.json only includes src, so a type-broken test or script would
      # otherwise sit green behind a passing build.
      - run: pnpm typecheck
      - run: pnpm test
